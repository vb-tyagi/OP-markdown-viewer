# Tests, vendor hash verification, and a reproducibility check of the committed editor bundle,
# on every push and pull request.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run verify-vendor
      - name: the committed editor bundle must be reproducible from the pinned packages
        run: npm run build:editor && git diff --exit-code -- public/vendor/
